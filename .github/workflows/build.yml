name: build

on:
  push:
    branches: [main, "ccr-*"]
    tags: ["v*"]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Tests
        run: dotnet test SurveyProjectManager.sln -c Release
      - name: Publish single-file exe
        run: >
          dotnet publish src/SurveyProjectManager.App -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: SurveyProjectManager-windows
          path: dist/SurveyProjectManager.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SurveyProjectManager.exe
